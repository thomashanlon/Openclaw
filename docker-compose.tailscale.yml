services:
  tailscale:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:latest}
    environment:
      TS_ACCEPT_DNS: "true"
      TS_AUTH_ONCE: "true"
      TS_AUTHKEY: ${TAILSCALE_AUTH_KEY:?Set TAILSCALE_AUTH_KEY in the deployment env file}
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_HOSTNAME: ${TS_HOSTNAME:?Set TS_HOSTNAME in the deployment env file}
      TS_LOCAL_ADDR_PORT: "127.0.0.1:9002"
      TS_SERVE_CONFIG: /config/serve.json
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9002/healthz",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  openclaw-gateway:
    network_mode: "service:tailscale"
    extra_hosts: !reset []
    ports: !reset []
    environment:
      OPENCLAW_DISABLE_BONJOUR: "1"
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "loopback",
        "--port",
        "18789",
      ]
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true

  openclaw-cli:
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
        restart: true
      openclaw-gateway:
        condition: service_healthy
        restart: true

volumes:
  tailscale-state:
